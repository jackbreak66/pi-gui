# Simplified-Chinese distribution build. Keep the official electron-builder.yml
# untouched: this config only renames the bundle (productName/appId) so the CN
# app never collides with an installed pi-gui.app or its user data, and drops
# signing/notarization/publishing that require upstream credentials.
appId: com.pi-gui.desktop.cn
productName: Pi GUI CN
copyright: Copyright 2026 Matthew Lam
electronVersion: 37.10.3

directories:
  output: release
  buildResources: resources

files:
  - out/**/*
  - package.json
  # The pnpm collector drops this nested version in the hoisted layout.
  # Keep retry 0.12 for Pi's lockfile code; other consumers require root 0.13.
  - from: ../../node_modules/proper-lockfile/node_modules/retry
    to: node_modules/proper-lockfile/node_modules/retry
    filter:
      - "**/*"
  # The collector nests the newer SSO under Bedrock. Its token provider must
  # stay below SSO: Bedrock itself pins a different token-provider version.
  - from: ../../node_modules/@aws-sdk/credential-provider-sso/node_modules/@aws-sdk/token-providers
    to: node_modules/@aws-sdk/client-bedrock-runtime/node_modules/@aws-sdk/credential-provider-sso/node_modules/@aws-sdk/token-providers
    filter:
      - "**/*"

extraResources:
  - from: resources/icon.png
    to: icon.png

asar: true
asarUnpack:
  - "**/*.node"
  - "**/*.wasm"
  - "**/node_modules/node-pty/**/*"
  - "**/node_modules/.pnpm/node-pty*/node_modules/node-pty/**/*"

artifactName: ${productName}-${version}-${arch}.${ext}

mac:
  category: public.app-category.developer-tools
  identity: null
  target:
    - target: dir
      arch: arm64
    - target: dmg
      arch: arm64
  darkModeSupport: true
  extraFiles:
    - from: build/native/pi-gui-notification-status-helper
      to: MacOS/pi-gui-notification-status-helper

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

publish: null
